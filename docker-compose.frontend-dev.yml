services:
  game-frontend:
    image: node:20-alpine
    build: !reset null
    working_dir: /app
    command: >
      sh -lc "if [ ! -d node_modules/next ]; then npm ci; fi;
      npm run dev -- --hostname 0.0.0.0"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_INTERNAL_URL: http://game-backend:4000
      NEXT_PUBLIC_AUTH_API_BASE_URL:
      NEXT_PUBLIC_GAME_API_BASE_URL:
      NEXT_PUBLIC_API_BASE_URL:
      NEXT_PUBLIC_GAME_CLIENT_URL: /game
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./website:/app
      - holdem_frontend_node_modules:/app/node_modules
    ports: !override
      - "3100:3000"

volumes:
  holdem_frontend_node_modules:
